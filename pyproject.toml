[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-scorecard-portfolio"
version = "0.1.0"
description = "End-to-end credit risk PD modeling, stress testing, SQL analytics, and dashboard portfolio project."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Madhusudan Yadav", email = "madhusudan00018@gmail.com" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

